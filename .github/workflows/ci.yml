name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has-xcode: ${{ steps.xcode.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - id: xcode
        run: echo "exists=$([ -d xcode ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Runs the built extension in Playwright's WebKit with a fake extension runtime and
  # recorded network data. No live network.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e2e -- --project=webkit
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Loads the real build/chrome extension into Chromium (not the fake runtime).
  chrome:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chrome-extension
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-chrome
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Checks the Firefox manifest and APIs, then packages the Chrome and Firefox builds.
  firefox:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - run: npx --yes web-ext@8 lint --source-dir build/firefox
      - name: Package
        run: |
          (cd build/chrome && zip -qr ../../card-finder-chrome.zip .)
          (cd build/firefox && zip -qr ../../card-finder-firefox.zip .)
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: browser-builds
          path: |
            card-finder-chrome.zip
            card-finder-firefox.zip

  # Builds the Safari app for macOS and iOS without signing. Skipped until xcode/ is committed.
  safari:
    needs: check
    if: needs.check.outputs.has-xcode == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build macOS app
        run: >-
          xcodebuild -project "xcode/Card Finder/Card Finder.xcodeproj" -scheme "Card Finder (macOS)"
          -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Build iOS app
        run: >-
          xcodebuild -project "xcode/Card Finder/Card Finder.xcodeproj" -scheme "Card Finder (iOS)"
          -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
